<style>

    /* =====================================
       STUDENT CARD
    ===================================== */

    .student-card {

        position: relative;

        width: 100%;

        background: #ffffff;

        border: 1px solid #e2e9e5;

        border-radius: 26px;

        padding: 22px;

        overflow: hidden;

        box-shadow:
            0 10px 30px rgba(23, 45, 36, 0.07);

        transition:
            transform 0.45s cubic-bezier(.2,.8,.2,1),
            box-shadow 0.45s ease,
            border-color 0.45s ease;

        animation:
            studentCardIn 0.65s ease both;
    }


    /* =====================================
       TOP GRADIENT LINE
    ===================================== */

    .student-card::before {

        content: "";

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 5px;

        background:
            linear-gradient(
                90deg,
                #10b981,
                #14b8a6,
                #f59e0b
            );
    }


    /* =====================================
       BIG DECORATIVE CIRCLE
    ===================================== */

    .student-card::after {

        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        top: -95px;
        right: -90px;

        border-radius: 50%;

        background:
            linear-gradient(
                135deg,
                rgba(16,185,129,0.14),
                rgba(245,158,11,0.10)
            );

        transition:
            transform 0.6s ease,
            opacity 0.6s ease;

        pointer-events: none;
    }


    /* =====================================
       HOVER
    ===================================== */

    .student-card:hover {

        transform:
            translateY(-11px)
            scale(1.015);

        border-color: #bce5d2;

        box-shadow:
            0 28px 60px rgba(16,185,129,0.13);
    }


    .student-card:hover::after {

        transform: scale(1.65);

        opacity: 0.8;
    }


    /* =====================================
       PROFILE HEADER
    ===================================== */

    .student-profile {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        gap: 13px;

        margin-bottom: 22px;
    }


    /* =====================================
       AVATAR
    ===================================== */

    .student-avatar {

        width: 61px;
        height: 61px;

        flex-shrink: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 19px;

        background:
            linear-gradient(
                135deg,
                #059669,
                #14b8a6
            );

        color: white;

        font-size: 24px;

        font-weight: 800;

        box-shadow:
            0 12px 25px rgba(5,150,105,0.25);

        transition:
            transform 0.45s ease,
            border-radius 0.45s ease;
    }


    .student-card:hover .student-avatar {

        transform:
            rotate(8deg)
            scale(1.1);

        border-radius: 50%;

        box-shadow:
            0 15px 30px rgba(5,150,105,0.35);
    }


    /* =====================================
       NAME
    ===================================== */

    .student-name {

        font-size: 19px;

        font-weight: 800;

        color: #17201d;

        margin-bottom: 5px;

        text-transform: capitalize;
    }


    .student-role {

        display: flex;

        align-items: center;

        gap: 6px;

        font-size: 11px;

        color: #8a9690;
    }


    .student-role i {

        color: #10a778;

        font-size: 11px;
    }


    /* =====================================
       ROLL NUMBER
    ===================================== */

    .student-roll {

        margin-left: auto;

        position: relative;

        z-index: 3;

        padding: 7px 10px;

        border-radius: 20px;

        background: #ecfdf5;

        color: #087f5b;

        font-size: 10px;

        font-weight: 800;

        white-space: nowrap;

        border: 1px solid #d1fae5;
    }


    /* =====================================
       INFORMATION GRID
    ===================================== */

    .student-info {

        position: relative;

        z-index: 2;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 10px;

        margin-bottom: 16px;
    }


    /* =====================================
       INFO BOX
    ===================================== */

    .student-info-box {

        padding: 13px;

        border-radius: 15px;

        background: #f8faf9;

        border: 1px solid #edf1ee;

        transition:
            transform 0.3s ease,
            background 0.3s ease,
            border-color 0.3s ease;
    }


    .student-info-box:hover {

        transform: translateY(-4px);

        background: #f0fdf7;

        border-color: #c8ead9;
    }


    /* =====================================
       LABEL
    ===================================== */

    .student-label {

        display: flex;

        align-items: center;

        gap: 6px;

        margin-bottom: 6px;

        color: #98a39e;

        font-size: 9px;

        font-weight: 700;

        letter-spacing: .6px;

        text-transform: uppercase;
    }


    .student-label i {

        color: #10a778;

        font-size: 10px;
    }


    /* =====================================
       VALUE
    ===================================== */

    .student-value {

        display: block;

        color: #25332d;

        font-size: 14px;

        font-weight: 750;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;

        text-transform: capitalize;
    }


    /* =====================================
       MARKS SECTION
    ===================================== */

    .student-marks {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 14px;

        margin-bottom: 17px;

        border-radius: 17px;

        background:
            linear-gradient(
                135deg,
                #ecfdf5,
                #fffbeb
            );

        border: 1px solid #e5f2eb;

        overflow: hidden;
    }


    /* =====================================
       MARKS LEFT
    ===================================== */

    .marks-left {

        display: flex;

        align-items: center;

        gap: 11px;
    }


    /* =====================================
       MARKS ICON
    ===================================== */

    .marks-icon {

        width: 40px;
        height: 40px;

        flex-shrink: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: #ffffff;

        color: #059669;

        box-shadow:
            0 6px 15px rgba(5,150,105,0.10);

        transition: 0.4s ease;
    }


    .student-card:hover .marks-icon {

        transform:
            rotate(-8deg)
            scale(1.08);
    }


    /* =====================================
       MARKS TEXT
    ===================================== */

    .marks-title {

        font-size: 11px;

        font-weight: 800;

        color: #53645c;
    }


    .marks-subtitle {

        margin-top: 3px;

        font-size: 9px;

        color: #9aa69f;
    }


    /* =====================================
       MARKS VALUE
    ===================================== */

    .marks-value {

        font-size: 23px;

        font-weight: 900;

        background:
            linear-gradient(
                90deg,
                #059669,
                #d97706
            );

        /* Standard CSS */
        background-clip: text;

        /* Browser support */
        -webkit-background-clip: text;

        color: transparent;

        -webkit-text-fill-color: transparent;
    }


    /* =====================================
       VIEW PROFILE BUTTON
    ===================================== */

    .student-button {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        width: 100%;

        padding: 12px;

        border-radius: 13px;

        background: #17251f;

        color: white;

        text-decoration: none;

        font-size: 12px;

        font-weight: 750;

        transition:
            background 0.35s ease,
            transform 0.35s ease,
            box-shadow 0.35s ease;
    }


    .student-button span {

        transition: 0.35s ease;
    }


    .student-button:hover {

        background:
            linear-gradient(
                90deg,
                #059669,
                #d97706
            );

        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(5,150,105,0.22);
    }


    .student-button:hover span {

        transform: translateX(6px);
    }


    /* =====================================
       ENTRY ANIMATION
    ===================================== */

    @keyframes studentCardIn {

        from {

            opacity: 0;

            transform:
                translateY(28px)
                scale(.96);
        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }
    }

</style>


<!-- =====================================
     ONE STUDENT CARD
===================================== -->

<article class="student-card">


    <!-- =================================
         PROFILE HEADER
    ================================= -->

    <div class="student-profile">


        <!-- FIRST LETTER -->

        <div class="student-avatar">

            {{ i.name|first|upper }}

        </div>


        <!-- NAME -->

        <div>

            <div class="student-name">

                {{ i.name }}

            </div>


            <div class="student-role">

                <i class="fa-solid fa-graduation-cap"></i>

                Student

            </div>

        </div>


        <!-- ROLL NUMBER -->

        <div class="student-roll">

            #{{ i.rollno }}

        </div>


    </div>


    <!-- =================================
         AGE + CITY
    ================================= -->

    <div class="student-info">


        <!-- AGE -->

        <div class="student-info-box">

            <span class="student-label">

                <i class="fa-solid fa-calendar-days"></i>

                Age

            </span>


            <span class="student-value">

                {{ i.age }}

            </span>

        </div>


        <!-- CITY -->

        <div class="student-info-box">

            <span class="student-label">

                <i class="fa-solid fa-location-dot"></i>

                City

            </span>


            <span class="student-value">

                {{ i.city }}

            </span>

        </div>


    </div>


    <!-- =================================
         MARKS
    ================================= -->

    <div class="student-marks">


        <div class="marks-left">


            <div class="marks-icon">

                <i class="fa-solid fa-chart-line"></i>

            </div>


            <div>

                <div class="marks-title">

                    Academic Marks

                </div>


                <div class="marks-subtitle">

                    Overall performance

                </div>

            </div>


        </div>


        <div class="marks-value">

            {{ i.marks }}

        </div>


    </div>


    <!-- =================================
         BUTTON
    ================================= -->

    <a href="#" class="student-button">

        View Profile

        <span>→</span>

    </a>


</article>
